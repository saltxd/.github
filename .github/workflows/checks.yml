# Public repo: a leaked key is world-readable the moment it is pushed.
name: checks
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  bump-script:
    # fixture tests for the bump script every deploy in the homelab depends on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/test_bump.sh
