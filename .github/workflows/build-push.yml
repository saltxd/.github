# Reusable: test -> build -> push to GHCR -> bump the image tag in saltxd/homelab-k3s (GitOps; Flux rolls it).
# Callers MUST grant `permissions: { contents: read, packages: write }` (a called workflow cannot exceed the caller's token).
# Caller example:
#   permissions: { contents: read, packages: write }
#   jobs:
#     web:
#       uses: saltxd/.github/.github/workflows/build-push.yml@main
#       with: { image: ghcr.io/saltxd/jobhunt-web, dockerfile: Dockerfile.web, runtime: python, test-cmd: "pytest -q tests",
#               bump-file: automation/helmrelease-jobhunt-web.yaml, bump-kind: helm-values }
#       secrets: { HOMELAB_K3S_DEPLOY_KEY: ${{ secrets.HOMELAB_K3S_DEPLOY_KEY }} }
name: build-push
on:
  workflow_call:
    inputs:
      image:            { type: string, required: true,  description: "ghcr.io/saltxd/<name>" }
      context:          { type: string, required: false, default: "." }
      dockerfile:       { type: string, required: false, default: "Dockerfile" }
      platforms:        { type: string, required: false, default: "linux/amd64" }
      runtime:          { type: string, required: false, default: "none", description: "python | node | none" }
      python-version:   { type: string, required: false, default: "3.12" }
      node-version:     { type: string, required: false, default: "22" }
      install-cmd:      { type: string, required: false, default: "" }
      lint-cmd:         { type: string, required: false, default: "" }
      test-cmd:         { type: string, required: false, default: "" }
      smoke-cmd:        { type: string, required: false, default: "", description: "sh command run INSIDE the built image before it is pushed (proves it is the right image)" }
      bump-file:        { type: string, required: false, default: "", description: "path in homelab-k3s; empty = no bump" }
      bump-kind:        { type: string, required: false, default: "manifest", description: "manifest | helm-values" }
      bump-extra-files: { type: string, required: false, default: "", description: "comma-separated extra manifest files" }
      free-disk:        { type: boolean, required: false, default: false, description: "remove preinstalled toolchains from the runner first (multi-GB images, e.g. Chrome + Camoufox)" }
      pull-login:       { type: boolean, required: false, default: false, description: "log in to GHCR on every run, not only before a push (the Dockerfile builds FROM a private ghcr.io image)" }
    secrets:
      HOMELAB_K3S_DEPLOY_KEY: { required: false }
permissions:
  contents: read
  packages: write
jobs:
  test:
    if: ${{ inputs.test-cmd != '' || inputs.lint-cmd != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: ${{ inputs.runtime == 'python' }}
        uses: actions/setup-python@v7
        with: { python-version: "${{ inputs.python-version }}", cache: pip }
      - if: ${{ inputs.runtime == 'node' }}
        uses: actions/setup-node@v7
        with: { node-version: "${{ inputs.node-version }}", cache: npm }
      - name: install
        if: ${{ inputs.install-cmd != '' }}
        run: ${{ inputs.install-cmd }}
      - name: lint
        if: ${{ inputs.lint-cmd != '' }}
        run: ${{ inputs.lint-cmd }}
      - name: test
        if: ${{ inputs.test-cmd != '' }}
        shell: bash
        run: |
          set -o pipefail
          ${{ inputs.test-cmd }} 2>&1 | tee test.log
          if grep -qE 'collected 0 items|no tests ran' test.log; then echo "::error::test suite collected 0 tests"; exit 1; fi
  build:
    needs: [test]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      pushed: ${{ steps.meta.outputs.pushed }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        shell: bash
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then echo "pushed=true" >> "$GITHUB_OUTPUT"; else echo "pushed=false" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ inputs.free-disk }}
        name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: docker/setup-buildx-action@v4
      - if: ${{ steps.meta.outputs.pushed == 'true' || inputs.pull-login }}
        uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Optional smoke: load the image locally and run a command inside it BEFORE anything is pushed or bumped.
      # 2026-10-11: jobhunt-triage was built from the wrong Dockerfile and every check still passed; a one-line
      # `test -f /home/triage/run_triage.py` here would have stopped it.
      - if: ${{ inputs.smoke-cmd != '' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: smoke/image:ci
          cache-from: "type=gha,scope=${{ inputs.image }}"
      - if: ${{ inputs.smoke-cmd != '' }}
        name: smoke (inside the image)
        env: { SMOKE: "${{ inputs.smoke-cmd }}" }
        run: docker run --rm --entrypoint sh smoke/image:ci -c "$SMOKE"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ steps.meta.outputs.pushed == 'true' }}
          tags: |
            ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ inputs.image }}:latest
          cache-from: "type=gha,scope=${{ inputs.image }}"
          cache-to: "type=gha,mode=max,scope=${{ inputs.image }}"
  bump:
    needs: [build]
    # !cancelled(): the needs chain passes through the optional `test` job, and a skipped ancestor would skip this job under the default success() check
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.pushed == 'true' && inputs.bump-file != '' }}
    runs-on: ubuntu-latest
    # per image: a bump of image A never queues behind (or cancels) a bump of image B. Ordering: the action only
    # bumps when its commit is still the branch head, so an older build never deploys over a newer one.
    concurrency: { group: "bump-homelab-k3s-${{ inputs.image }}", cancel-in-progress: false }
    steps:
      - uses: saltxd/.github/.github/actions/bump-image@main
        with: { image: "${{ inputs.image }}", tag: "${{ needs.build.outputs.tag }}", file: "${{ inputs.bump-file }}", kind: "${{ inputs.bump-kind }}",
                extra-files: "${{ inputs.bump-extra-files }}", deploy-key: "${{ secrets.HOMELAB_K3S_DEPLOY_KEY }}" }
