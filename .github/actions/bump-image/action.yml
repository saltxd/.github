# Composite action: rewrite an image tag in saltxd/homelab-k3s and push the commit (GitOps; Flux rolls it out).
# Used by the reusable build-push.yml, and directly by repos that keep their own build pipeline (custom tag scheme)
# and only need the bump. Caller example, as the job after the image push:
#   bump:
#     needs: [image]
#     if: github.ref == 'refs/heads/main'
#     runs-on: ubuntu-latest
#     concurrency: { group: "bump-homelab-k3s-ghcr.io/saltxd/<name>", cancel-in-progress: false }
#     steps:
#       - uses: saltxd/.github/.github/actions/bump-image@main
#         with: { image: ghcr.io/saltxd/<name>, tag: "${{ github.sha }}", file: curator/<name>.yaml, kind: manifest,
#                 deploy-key: "${{ secrets.HOMELAB_K3S_DEPLOY_KEY }}" }
name: bump-image
description: Rewrite an image tag in saltxd/homelab-k3s and push (Flux deploys it)
inputs:
  image:       { required: true,  description: "ghcr.io/saltxd/<name> (must already be pushed with <tag>); comma-separated for several images sharing one tag and one commit" }
  tag:         { required: true,  description: "the tag that was just pushed" }
  file:        { required: true,  description: "path in homelab-k3s" }
  kind:        { required: false, default: "manifest", description: "manifest | helm-values" }
  extra-files: { required: false, default: "", description: "comma-separated extra manifest files" }
  deploy-key:  { required: true,  description: "write deploy key for saltxd/homelab-k3s (repo secret HOMELAB_K3S_DEPLOY_KEY)" }
  only-if-head: { required: false, default: "true", description: "branch pushes: skip the bump when a newer commit is already on the branch (its own run will deploy), so an older build can never deploy after a newer one" }
runs:
  using: composite
  steps:
    - name: is this commit still the branch head?
      id: head
      shell: bash
      env: { GH_TOKEN: "${{ github.token }}", ONLY: "${{ inputs.only-if-head }}" }
      run: |
        if [ "$ONLY" != "true" ] || [ "$GITHUB_EVENT_NAME" != "push" ] || [ "${GITHUB_REF#refs/heads/}" = "$GITHUB_REF" ]; then
          echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        head=$(gh api "repos/$GITHUB_REPOSITORY/commits/${GITHUB_REF#refs/heads/}" --jq .sha 2>/dev/null || echo "$GITHUB_SHA")
        if [ "$head" = "$GITHUB_SHA" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
        else echo "::notice::${GITHUB_SHA::7} is no longer the head of ${GITHUB_REF#refs/heads/} (${head::7}); its run deploys instead"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
    - name: checkout homelab-k3s with the write deploy key
      if: steps.head.outputs.go == 'true'
      uses: actions/checkout@v4
      with: { repository: saltxd/homelab-k3s, ref: main, path: homelab-k3s, ssh-key: "${{ inputs.deploy-key }}", persist-credentials: true }
    - name: bump
      if: steps.head.outputs.go == 'true'
      shell: bash
      env: { IMAGE: "${{ inputs.image }}", TAG: "${{ inputs.tag }}", FILE: "${{ inputs.file }}", KIND: "${{ inputs.kind }}", EXTRA: "${{ inputs.extra-files }}", SCRIPT: "${{ github.action_path }}/bump-image.sh" }
      run: |
        set -euo pipefail
        cd homelab-k3s
        git config user.name "ci-bump"; git config user.email "ci-bump@users.noreply.github.com"
        mode=""; [ "$KIND" = "helm-values" ] && mode="--helm-values"
        IFS=',' read -ra imgs <<< "$IMAGE"; IFS=',' read -ra extra <<< "$EXTRA"
        for img in "${imgs[@]}"; do
          bash "$SCRIPT" "$FILE" "$img" "$TAG" $mode
          for f in "${extra[@]}"; do [ -n "$f" ] && bash "$SCRIPT" "$f" "$img" "$TAG"; done
        done
        IMAGE="${imgs[0]}"; [ "${#imgs[@]}" -gt 1 ] && IMAGE="${imgs[0]%-*}"
        git add -A
        if git diff --cached --quiet; then echo "nothing to bump"; exit 0; fi
        git commit -m "ci(${IMAGE##*/}): ${TAG} (${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
        # other repos bump homelab-k3s concurrently: rebase + retry with jitter instead of failing on the first race
        for attempt in 1 2 3 4 5; do
          git push origin HEAD:main && exit 0
          sleep $(( attempt * 3 + RANDOM % 5 )); git pull --rebase -q origin main
        done
        echo "::error::could not push the bump after 5 attempts"; exit 1
